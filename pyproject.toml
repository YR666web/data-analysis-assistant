[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-analysis-assistant"
version = "1.0.0"
description = "数据分析助手 · 多智能体数据分析系统"
requires-python = ">=3.12"
dependencies = [
    # Web 框架 / ASGI 服务器
    "fastapi>=0.136",
    "uvicorn>=0.48",
    "python-multipart>=0.0.9",
    # 多智能体框架
    "deepagents>=0.6.6",
    # LLM 接入（OpenAI 兼容协议）
    "langchain-openai",
    "langchain-core",
    # 数据库驱动
    "mysql-connector-python>=9.7",
    # 向量数据库（本地 Chroma）
    "langchain-chroma",
    # Embedding（本地 BGE 模型）
    "langchain-huggingface",
    "sentence-transformers",
    # 文档分块
    "langchain-text-splitters",
    # 全网检索
    "tavily-python>=0.7",
    # 文档解析
    "python-docx",
    "pypdf",
    "openpyxl",
    "xlrd>=2.0.1",
    "pandas",
    # PDF 生成（Markdown → Word COM）
    "markdown",
    "pywin32>=306; sys_platform == 'win32'",
    # 横切关注点
    "colorlog",
    "pyyaml",
    "python-dotenv",
]

[tool.setuptools]
packages = ["agent", "agent.sub_agents", "api", "tools", "utils"]
